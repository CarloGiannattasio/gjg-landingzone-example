# Landing zone pipeline. Plan-only by default.
# contents: read is enough to check out the repo.
# id-token: write lets the plan job assume AWS_PLAN_ROLE_ARN with GitHub OIDC.
# pull-requests: write and issues: write are set on pipeline. On a pull
# request that job posts one plans table and deletes the older plan comments.
# Plan scripts do not receive GITHUB_TOKEN. Push and workflow_dispatch do not
# comment, so those graphs have no comment jobs.
# No static AWS or GCP keys are stored in this workflow.
name: Landing Zone Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.9.8"
  # Root plans AWS and GCP together. The real GCP job and the GCP mock both
  # pass this AWS account file plus each path in the GCP config list.
  GCP_PLAN_AWS_CONFIG: ../config/aws/example/example-prod/example-prod.json

jobs:
  lint-and-scan:
    name: lint-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper hides Terraform's exit code. fmt -check must fail the job.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: TFLint
        run: tflint --init && tflint --recursive
        env:
          # Raises the GitHub API rate limit if a plugin install is required.
          GITHUB_TOKEN: ${{ github.token }}

      # IAM JSON under policies/ is loaded with file() and is not Terraform.
      # Checkov's terraform framework scans the modules and the root module.
      # soft_fail is omitted so findings fail the job. The only suppression is
      # an inline CKV_AWS_148 skip on aws_default_vpc, which adopts that VPC
      # so Terraform can delete it.
      - name: Checkov (modules)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          framework: terraform
          output_format: cli
          download_external_modules: false

      - name: Checkov (root)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: root
          framework: terraform
          output_format: cli
          download_external_modules: false

      - name: Validate landing zone config contract
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          required = (
              "environment",
              "business_unit",
              "region",
              "cost_center",
              "mandatory_tags",
              "vpc",
          )
          files = sorted(Path("config").rglob("*.json"))
          if not files:
              print("No files matched config/**/*.json.", file=sys.stderr)
              sys.exit(1)

          failed = False
          for path in files:
              try:
                  document = json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  print(f"{path}: invalid JSON ({exc})", file=sys.stderr)
                  failed = True
                  continue
              if not isinstance(document, dict):
                  print(f"{path}: expected a JSON object", file=sys.stderr)
                  failed = True
                  continue

              missing = [key for key in required if key not in document]
              has_identity = "account_name" in document or "project_id" in document
              if not has_identity:
                  missing.append("account_name or project_id")
              if missing:
                  print(f"{path}: missing {', '.join(missing)}", file=sys.stderr)
                  failed = True
              else:
                  print(f"{path}: ok")

          sys.exit(1 if failed else 0)
          PY

  # Prints only oidc / static / unset. Secret values stay in the environment
  # and are never echoed. The real plan job is skipped when this is unset.
  aws-credentials-present:
    name: real-account credentials check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.status.outputs.configured }}
      mode: ${{ steps.status.outputs.mode }}
    steps:
      - id: status
        env:
          AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_PLAN_ROLE_ARN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "mode=static" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "mode=unset" >> "$GITHUB_OUTPUT"
            echo "Real-account plan skipped: set AWS_PLAN_ROLE_ARN, or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, in GitHub Actions secrets."
          fi

  terraform-plan:
    name: terraform-plan (real AWS account)
    needs:
      - aws-credentials-present
      - gcp-credentials-present
    if: needs.aws-credentials-present.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Mock job terraform-plan-moto aliases this list. Add an account file here only.
        # pipeline AWS_ACCOUNTS is the basename of each path, in this order.
        config_path: &aws_config_paths
          - ../config/aws/example/example-prod/example-prod.json
          - ../config/aws/example/example-nonprod/example-nonprod.json
          - ../config/aws/example/example-preprod/example-preprod.json
    defaults:
      run:
        working-directory: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Plan-only. No static keys are stored in this file. OIDC is preferred.
      # Static keys are used only when the role secret is empty and both key
      # secrets are set. Values are not printed.
      - name: Configure AWS credentials from OIDC role
        if: needs.aws-credentials-present.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials from static keys
        if: needs.aws-credentials-present.outputs.mode == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Root also plans GCP. Authenticate only when those secrets are set.
      # Values are not printed. If they are unset, provider init fails closed.
      - name: Authenticate to Google Cloud with Workload Identity
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with a service account key
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'sa_key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/real-plans"
          terraform plan -input=false -no-color -var="config_path=${{ matrix.config_path }}" -out=tfplan 2>&1 | tee "${GITHUB_WORKSPACE}/real-plans/${base}.txt"

      - name: Ensure real-account plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/real-plans"
          file="${GITHUB_WORKSPACE}/real-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Real-account plan produced no output for ${base}." > "$file"
          fi

      - name: Upload real-account plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-real-${{ strategy.job-index }}
          path: ${{ github.workspace }}/real-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # SAFETY: live apply is intentionally disabled. This pipeline defaults to
      # plan-only execution. The block below is a YAML comment, so GitHub
      # Actions does not parse it and the command cannot run.
      #
      # - name: Terraform apply
      #   run: terraform apply -input=false tfplan

  # Mock plan of the same AWS account files as terraform-plan. No AWS or GCP
  # secrets. Does not comment. On pull_request, pipeline posts the plans table.
  # Push to main and workflow_dispatch still plan and do not comment.
  terraform-plan-moto:
    name: terraform-plan-moto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config_path: *aws_config_paths
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Cell config, Cloud Custodian's pinned Moto, and the loopback Compute
      # stub because root includes the Google provider. No secrets. No apply.
      # GITHUB_TOKEN is cleared so the plan script cannot read or print it.
      - name: Terraform plan against Moto
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/moto-plans"
          ./scripts/plan-with-c7n-moto.sh "${{ matrix.config_path }}" 2>&1 | tee "${GITHUB_WORKSPACE}/moto-plans/${base}.txt"

      - name: Ensure Moto plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/moto-plans"
          file="${GITHUB_WORKSPACE}/moto-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Moto plan produced no output for ${base}." > "$file"
          fi

      - name: Upload Moto plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-moto-${{ strategy.job-index }}
          path: ${{ github.workspace }}/moto-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  terraform-test:
    name: terraform-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # tests/vpc_tshirt.tftest.hcl mocks the AWS provider. No credentials.
      # tests.tf declares no resources so init loads that test file.
      # Terraform 1.9 skips module install when a directory has no .tf files.
      - name: Terraform init
        working-directory: ${{ github.workspace }}
        run: terraform init -backend=false -input=false

      - name: Terraform test
        working-directory: ${{ github.workspace }}
        run: terraform test

  gcp-credentials-present:
    name: real GCP credentials check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.status.outputs.configured }}
      gcp_mode: ${{ steps.status.outputs.gcp_mode }}
      aws_mode: ${{ steps.status.outputs.aws_mode }}
    steps:
      - id: status
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          gcp_mode=unset
          aws_mode=unset
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] && [ -n "${GCP_SERVICE_ACCOUNT}" ]; then
            gcp_mode=wif
          elif [ -n "${GCP_SA_KEY}" ]; then
            gcp_mode=sa_key
          fi
          if [ -n "${AWS_PLAN_ROLE_ARN}" ]; then
            aws_mode=oidc
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            aws_mode=static
          fi
          echo "gcp_mode=${gcp_mode}" >> "$GITHUB_OUTPUT"
          echo "aws_mode=${aws_mode}" >> "$GITHUB_OUTPUT"
          if [ "${gcp_mode}" != "unset" ] && [ "${aws_mode}" != "unset" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Real GCP plan skipped (gcp_mode=${gcp_mode}, aws_mode=${aws_mode}). Secret values are not printed."
          fi

  # Real plan of root for each GCP project file. Needs GCP and AWS credentials,
  # because one root plan talks to both providers. Apply is not a step.
  # On pull_request, pipeline posts the add, change, and destroy counts.
  terraform-plan-gcp:
    name: terraform-plan (real GCP)
    needs: gcp-credentials-present
    if: needs.gcp-credentials-present.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Mock job terraform-plan-gcp-mock aliases this list. Add a project file here only.
        # pipeline GCP_ACCOUNTS is the basename of each path, in this order.
        gcp_config_path: &gcp_config_paths
          - ../config/gcp/example/example-prod/example-prod.json
    defaults:
      run:
        working-directory: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials from OIDC role
        if: needs.gcp-credentials-present.outputs.aws_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials from static keys
        if: needs.gcp-credentials-present.outputs.aws_mode == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Authenticate to Google Cloud with Workload Identity
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with a service account key
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'sa_key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-plans"
          terraform plan -input=false -no-color \
            -var="config_path=${{ env.GCP_PLAN_AWS_CONFIG }}" \
            -var="gcp_config_path=${{ matrix.gcp_config_path }}" \
            -out=tfplan 2>&1 | tee "${GITHUB_WORKSPACE}/gcp-plans/${base}.txt"

      - name: Ensure real GCP plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-plans"
          file="${GITHUB_WORKSPACE}/gcp-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Real GCP plan produced no output for ${base}." > "$file"
          fi

      - name: Upload real GCP plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-gcp-${{ strategy.job-index }}
          path: ${{ github.workspace }}/gcp-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # SAFETY: live apply is intentionally disabled. This pipeline defaults to
      # plan-only execution. The block below is a YAML comment, so GitHub
      # Actions does not parse it and the command cannot run.
      #
      # - name: Terraform apply
      #   run: terraform apply -input=false tfplan

  # Mock plan of the same GCP project files as terraform-plan-gcp. No real
  # credentials. Does not comment. On pull_request, pipeline posts the plans
  # table. Push to main and workflow_dispatch still plan and do not comment.
  terraform-plan-gcp-mock:
    name: terraform-plan-gcp-mock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gcp_config_path: *gcp_config_paths
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same AWS account file and GCP project file as the real GCP plan.
      # Moto plus the loopback Compute stub. No secrets. No apply.
      # GITHUB_TOKEN is cleared so the plan script cannot read or print it.
      - name: Terraform plan against the GCP mock
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-mock-plans"
          ./scripts/plan-with-gcp-mock.sh "${{ env.GCP_PLAN_AWS_CONFIG }}" "${{ matrix.gcp_config_path }}" 2>&1 | tee "${GITHUB_WORKSPACE}/gcp-mock-plans/${base}.txt"

      - name: Ensure GCP mock plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-mock-plans"
          file="${GITHUB_WORKSPACE}/gcp-mock-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "GCP mock plan produced no output for ${base}." > "$file"
          fi

      - name: Upload GCP mock plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-gcp-mock-${{ strategy.job-index }}
          path: ${{ github.workspace }}/gcp-mock-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Fan-in. GitHub draws a separate graph for every job that nothing needs.
  # This job needs the rest, so the run is one pipeline. On a pull request it
  # posts one comment: a table of each plan, the account, and the add, change,
  # and destroy counts. Push and workflow_dispatch do not comment. A skipped
  # plan does not fail this job. A failed job does.
  pipeline:
    name: pipeline
    needs:
      - lint-and-scan
      - terraform-test
      - aws-credentials-present
      - gcp-credentials-present
      - terraform-plan
      - terraform-plan-gcp
      - terraform-plan-moto
      - terraform-plan-gcp-mock
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Fail when any job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["RESULTS"])
          bad = sorted(
              name
              for name, info in needs.items()
              if info.get("result") not in ("success", "skipped")
          )
          if bad:
              print("Failed jobs: " + ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          print("No failed jobs.")
          PY

      - name: Checkout
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download plans
        if: always() && github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: plan-*
          path: plans

      - name: Post the plans table
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN_ROOT: ${{ github.workspace }}/plans
          AWS_ACCOUNTS: example-prod,example-nonprod,example-preprod
          GCP_ACCOUNTS: example-prod
          MOTO_RESULT: ${{ needs.terraform-plan-moto.result }}
          AWS_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          AWS_CONFIGURED: ${{ needs.aws-credentials-present.outputs.configured }}
          GCP_MOCK_RESULT: ${{ needs.terraform-plan-gcp-mock.result }}
          GCP_PLAN_RESULT: ${{ needs.terraform-plan-gcp.result }}
          GCP_CONFIGURED: ${{ needs.gcp-credentials-present.outputs.configured }}
          GCP_MODE: ${{ needs.gcp-credentials-present.outputs.gcp_mode }}
          AWS_MODE: ${{ needs.gcp-credentials-present.outputs.aws_mode }}
        with:
          script: |
            const path = require("path");
            const { postPlanTable } = require(path.join(process.env.GITHUB_WORKSPACE, "scripts", "plan-comment.js"));
            await postPlanTable({ github, context, core });
