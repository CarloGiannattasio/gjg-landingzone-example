# Landing zone pipeline. Plan-only by default.
# contents: read is enough to check out the repo.
# id-token: write lets the plan job assume AWS_PLAN_ROLE_ARN with GitHub OIDC.
# pull-requests: write is set on the jobs that comment: comment-moto-plans,
# comment-gcp-mock, comment-plans, and comment-gcp-plan.
# comment-plans and comment-gcp-plan do not check out the pull request.
# comment-moto-plans and comment-gcp-mock check out only to load the comment
# helper. Plan scripts do not receive GITHUB_TOKEN.
# No static AWS or GCP keys are stored in this workflow.
name: Landing Zone Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.9.8"
  # Root plans AWS and GCP together. The real GCP job and the GCP mock both
  # pass this AWS account file plus each path in the GCP config list.
  GCP_PLAN_AWS_CONFIG: ../config/aws/example/example-prod/example-prod.json

jobs:
  lint-and-scan:
    name: lint-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper hides Terraform's exit code. fmt -check must fail the job.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: TFLint
        run: tflint --init && tflint --recursive
        env:
          # Raises the GitHub API rate limit if a plugin install is required.
          GITHUB_TOKEN: ${{ github.token }}

      # IAM JSON under policies/ is loaded with file() and is not Terraform.
      # Checkov's terraform framework scans the modules and the root module.
      # soft_fail is omitted so findings fail the job. The only suppression is
      # an inline CKV_AWS_148 skip on aws_default_vpc, which adopts that VPC
      # so Terraform can delete it.
      - name: Checkov (modules)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          framework: terraform
          output_format: cli
          download_external_modules: false

      - name: Checkov (root)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: root
          framework: terraform
          output_format: cli
          download_external_modules: false

      - name: Validate landing zone config contract
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          required = (
              "environment",
              "business_unit",
              "region",
              "cost_center",
              "mandatory_tags",
              "vpc",
          )
          files = sorted(Path("config").rglob("*.json"))
          if not files:
              print("No files matched config/**/*.json.", file=sys.stderr)
              sys.exit(1)

          failed = False
          for path in files:
              try:
                  document = json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  print(f"{path}: invalid JSON ({exc})", file=sys.stderr)
                  failed = True
                  continue
              if not isinstance(document, dict):
                  print(f"{path}: expected a JSON object", file=sys.stderr)
                  failed = True
                  continue

              missing = [key for key in required if key not in document]
              has_identity = "account_name" in document or "project_id" in document
              if not has_identity:
                  missing.append("account_name or project_id")
              if missing:
                  print(f"{path}: missing {', '.join(missing)}", file=sys.stderr)
                  failed = True
              else:
                  print(f"{path}: ok")

          sys.exit(1 if failed else 0)
          PY

  # Prints only oidc / static / unset. Secret values stay in the environment
  # and are never echoed. The real plan job is skipped when this is unset.
  aws-credentials-present:
    name: real-account credentials check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.status.outputs.configured }}
      mode: ${{ steps.status.outputs.mode }}
    steps:
      - id: status
        env:
          AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_PLAN_ROLE_ARN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "mode=static" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "mode=unset" >> "$GITHUB_OUTPUT"
            echo "Real-account plan skipped: set AWS_PLAN_ROLE_ARN, or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, in GitHub Actions secrets."
          fi

  terraform-plan:
    name: terraform-plan (real AWS account)
    needs:
      - aws-credentials-present
      - gcp-credentials-present
    if: needs.aws-credentials-present.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Mock job terraform-plan-moto aliases this list. Add an account file here only.
        config_path: &aws_config_paths
          - ../config/aws/example/example-prod/example-prod.json
          - ../config/aws/example/example-nonprod/example-nonprod.json
          - ../config/aws/example/example-preprod/example-preprod.json
    defaults:
      run:
        working-directory: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Plan-only. No static keys are stored in this file. OIDC is preferred.
      # Static keys are used only when the role secret is empty and both key
      # secrets are set. Values are not printed.
      - name: Configure AWS credentials from OIDC role
        if: needs.aws-credentials-present.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials from static keys
        if: needs.aws-credentials-present.outputs.mode == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Root also plans GCP. Authenticate only when those secrets are set.
      # Values are not printed. If they are unset, provider init fails closed.
      - name: Authenticate to Google Cloud with Workload Identity
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with a service account key
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'sa_key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/real-plans"
          terraform plan -input=false -no-color -var="config_path=${{ matrix.config_path }}" -out=tfplan 2>&1 | tee "${GITHUB_WORKSPACE}/real-plans/${base}.txt"

      - name: Ensure real-account plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/real-plans"
          file="${GITHUB_WORKSPACE}/real-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Real-account plan produced no output for ${base}." > "$file"
          fi

      - name: Upload real-account plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-real-${{ strategy.job-index }}
          path: ${{ github.workspace }}/real-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # SAFETY: live apply is intentionally disabled. This pipeline defaults to
      # plan-only execution. The block below is a YAML comment, so GitHub
      # Actions does not parse it and the command cannot run.
      #
      # - name: Terraform apply
      #   run: terraform apply -input=false tfplan

  # Mock plan of the same AWS account files as terraform-plan. No AWS or GCP
  # secrets. Does not comment. On pull_request, comment-moto-plans posts
  # <!-- landing-zone-plan -->. Push to main and workflow_dispatch still plan.
  terraform-plan-moto:
    name: terraform-plan-moto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config_path: *aws_config_paths
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Cell config, Cloud Custodian's pinned Moto, and the loopback Compute
      # stub because root includes the Google provider. No secrets. No apply.
      # GITHUB_TOKEN is cleared so the plan script cannot read or print it.
      - name: Terraform plan against Moto
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/moto-plans"
          ./scripts/plan-with-c7n-moto.sh "${{ matrix.config_path }}" 2>&1 | tee "${GITHUB_WORKSPACE}/moto-plans/${base}.txt"

      - name: Ensure Moto plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/moto-plans"
          file="${GITHUB_WORKSPACE}/moto-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Moto plan produced no output for ${base}." > "$file"
          fi

      - name: Upload Moto plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-moto-${{ strategy.job-index }}
          path: ${{ github.workspace }}/moto-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # One sticky Moto comment for the whole matrix. Pull requests only.
  # Push to main and workflow_dispatch do not comment.
  comment-moto-plans:
    name: comment-moto-plans
    needs: terraform-plan-moto
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.terraform-plan-moto.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Moto plans
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: plan-moto-*
          path: plans/moto

      - name: Post or update sticky Moto plan comment
        if: always()
        uses: actions/github-script@v9
        env:
          PLAN_RESULT: ${{ needs.terraform-plan-moto.result }}
          PLAN_DIR: ${{ github.workspace }}/plans/moto
        with:
          script: |
            const path = require("path");
            const { postMotoPlanComment } = require(path.join(process.env.GITHUB_WORKSPACE, "scripts", "moto-plan-comment.js"));
            await postMotoPlanComment({ github, context, core });

  terraform-test:
    name: terraform-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # tests/vpc_tshirt.tftest.hcl mocks the AWS provider. No credentials.
      # tests.tf declares no resources so init loads that test file.
      # Terraform 1.9 skips module install when a directory has no .tf files.
      - name: Terraform init
        working-directory: ${{ github.workspace }}
        run: terraform init -backend=false -input=false

      - name: Terraform test
        working-directory: ${{ github.workspace }}
        run: terraform test

  # Real-account plan comment only. comment-moto-plans posts <!-- landing-zone-plan -->.
  # No checkout: the pull request tree is not on disk, and this token cannot
  # be used by that code. Pull requests only; push and workflow_dispatch skip it.
  comment-plans:
    name: comment-plans
    needs:
      - aws-credentials-present
      - terraform-plan
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.aws-credentials-present.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download real-account plans
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: plan-real-*
          path: plans/real

      - name: Post or update sticky plan comments
        if: always()
        uses: actions/github-script@v9
        env:
          REAL_RESULT: ${{ needs.terraform-plan.result }}
          REAL_CONFIGURED: ${{ needs.aws-credentials-present.outputs.configured }}
          REAL_MODE: ${{ needs.aws-credentials-present.outputs.mode }}
          CREDENTIALS_RESULT: ${{ needs.aws-credentials-present.result }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const MAX_PLAN = 60000;
            const MAX_COMMENT = 65000;
            const REAL_MARKER = "<!-- landing-zone-plan-real -->";

            function stripAnsi(text) {
              return String(text)
                .replace(/\u001b\[[0-9;]*[A-Za-z]/g, "")
                .replace(/\u001b\][^\u0007]*(?:\u0007|\u001b\\)/g, "");
            }

            function redact(text) {
              return stripAnsi(text)
                .replace(/\u0000/g, "")
                .replace(/\b(AKIA|ASIA|AROA|AIDA)[0-9A-Z]{16}\b/g, "[redacted]")
                .replace(/\bgithub_pat_[A-Za-z0-9_]{20,}\b/g, "[redacted]")
                .replace(/\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}\b/g, "[redacted]")
                .replace(/(aws_secret_access_key|aws_access_key_id)\s*[:=]\s*\S+/gi, "$1=[redacted]");
            }

            function truncate(text, limit) {
              if (text.length <= limit) return text;
              const suffix = `\n… truncated to ${limit} characters`;
              const keep = Math.max(0, limit - suffix.length);
              return text.slice(0, keep) + suffix;
            }

            function escapeHtml(text) {
              return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            }

            function planHtml(body, limit) {
              const clipped = truncate(redact(body), limit);
              let escaped = escapeHtml(clipped);
              if (escaped.length > limit) {
                escaped = truncate(escaped, limit);
              }
              return escaped;
            }

            function detailsBlock(summary, body, limit) {
              return [
                "<details>",
                `<summary>${escapeHtml(summary)}</summary>`,
                "",
                `<pre><code>${planHtml(body, limit)}</code></pre>`,
                "</details>",
              ].join("\n");
            }

            function walkTxt(dir, found) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walkTxt(full, found);
                else if (entry.isFile() && entry.name.endsWith(".txt")) found.push(full);
              }
            }

            function planSummaryLine(text) {
              const plan = text.match(/^Plan:\s+\d+\s+to add,\s+\d+\s+to change,\s+\d+\s+to destroy\.?\s*$/m);
              if (plan) return plan[0].trim();
              const none = text.match(/^No changes\..+$/m);
              if (none) return none[0].trim();
              return "";
            }

            function sectionsUnder(dir) {
              if (!fs.existsSync(dir)) return [];
              const files = [];
              walkTxt(dir, files);
              files.sort();
              return files.map((file) => {
                const raw = stripAnsi(fs.readFileSync(file, "utf8").slice(0, 80000));
                const name = path.basename(file, ".txt");
                const summaryLine = planSummaryLine(raw);
                return {
                  summary: summaryLine ? `${name}: ${summaryLine}` : name,
                  body: raw.trim() ? raw : "(no output)",
                };
              });
            }

            function render(marker, header, sections) {
              const wrapper = (summary) =>
                `<details>\n<summary>${escapeHtml(summary)}</summary>\n\n<pre><code></code></pre>\n</details>\n\n`.length;
              let overhead = marker.length + 1 + header.length + 2;
              for (const section of sections) overhead += wrapper(section.summary);
              const per =
                sections.length === 0
                  ? MAX_PLAN
                  : Math.max(2000, Math.min(MAX_PLAN, Math.floor((MAX_COMMENT - overhead) / sections.length)));
              const blocks = sections.map((section) => detailsBlock(section.summary, section.body, per));
              let body = `${marker}\n${header}`;
              if (blocks.length) body += `\n\n${blocks.join("\n\n")}`;
              if (body.length > MAX_COMMENT && sections.length) {
                const overflow = body.length - MAX_COMMENT;
                const tighter = Math.max(500, per - Math.ceil(overflow / sections.length) - 80);
                const again = sections.map((section) => detailsBlock(section.summary, section.body, tighter));
                body = `${marker}\n${header}\n\n${again.join("\n\n")}`;
              }
              if (body.length > MAX_COMMENT) {
                body = `${body.slice(0, MAX_COMMENT - 28)}\n… comment truncated`;
              }
              return body;
            }

            async function upsert(comments, marker, body) {
              const existing = comments.find(
                (comment) => typeof comment.body === "string" && comment.body.startsWith(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`Updated comment ${existing.id} for ${marker}`);
                return;
              }
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              comments.push(created.data);
              console.log(`Created comment ${created.data.id} for ${marker}`);
            }

            const realResult = process.env.REAL_RESULT || "unknown";
            const configured = process.env.REAL_CONFIGURED || "";
            const mode = process.env.REAL_MODE || "";
            const credentialsResult = process.env.CREDENTIALS_RESULT || "unknown";
            const secretsUnset = configured === "false" || mode === "unset";
            const realSkipped = realResult === "skipped";

            let realHeader = "## Terraform plan (real AWS account)\n\n";
            let realSections = [];
            if (realSkipped && secretsUnset) {
              realHeader +=
                "Real-account plan was skipped because AWS plan secrets are unset. " +
                "Set `AWS_PLAN_ROLE_ARN`, or both `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`, " +
                "in GitHub Actions secrets to run this plan. Secret values are not printed.";
            } else if (realSkipped) {
              realHeader +=
                `Real-account plan was skipped (credentials check result: \`${credentialsResult}\`). ` +
                "Secret values are not printed.";
            } else {
              realHeader +=
                "Job `terraform-plan (real AWS account)` " +
                `result: \`${realResult}\`. Credential mode: \`${mode || "unknown"}\`. ` +
                "Secret values are not printed.";
              realSections = sectionsUnder("plans/real");
              if (realSections.length === 0) {
                realHeader += "\n\nThe real-account plan job did not upload plan output.";
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            await upsert(comments, REAL_MARKER, render(REAL_MARKER, realHeader, realSections));

  # Prints only wif / sa_key / unset and oidc / static / unset. Secret values
  # stay in the environment and are never echoed. The real GCP plan runs only
  # when both a GCP mode and an AWS plan mode are set, because root talks to
  # both providers.
  gcp-credentials-present:
    name: real GCP credentials check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.status.outputs.configured }}
      gcp_mode: ${{ steps.status.outputs.gcp_mode }}
      aws_mode: ${{ steps.status.outputs.aws_mode }}
    steps:
      - id: status
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          gcp_mode=unset
          aws_mode=unset
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] && [ -n "${GCP_SERVICE_ACCOUNT}" ]; then
            gcp_mode=wif
          elif [ -n "${GCP_SA_KEY}" ]; then
            gcp_mode=sa_key
          fi
          if [ -n "${AWS_PLAN_ROLE_ARN}" ]; then
            aws_mode=oidc
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            aws_mode=static
          fi
          echo "gcp_mode=${gcp_mode}" >> "$GITHUB_OUTPUT"
          echo "aws_mode=${aws_mode}" >> "$GITHUB_OUTPUT"
          if [ "${gcp_mode}" != "unset" ] && [ "${aws_mode}" != "unset" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Real GCP plan skipped (gcp_mode=${gcp_mode}, aws_mode=${aws_mode}). Secret values are not printed."
          fi

  # Real plan of root for each GCP project file. Needs GCP and AWS credentials,
  # because one root plan talks to both providers. On pull_request,
  # comment-gcp-plan updates <!-- landing-zone-plan-gcp -->. Apply is not a step.
  terraform-plan-gcp:
    name: terraform-plan (real GCP)
    needs: gcp-credentials-present
    if: needs.gcp-credentials-present.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Mock job terraform-plan-gcp-mock aliases this list. Add a project file here only.
        gcp_config_path: &gcp_config_paths
          - ../config/gcp/example/example-prod/example-prod.json
    defaults:
      run:
        working-directory: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials from OIDC role
        if: needs.gcp-credentials-present.outputs.aws_mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials from static keys
        if: needs.gcp-credentials-present.outputs.aws_mode == 'static'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Authenticate to Google Cloud with Workload Identity
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with a service account key
        if: needs.gcp-credentials-present.outputs.gcp_mode == 'sa_key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-plans"
          terraform plan -input=false -no-color \
            -var="config_path=${{ env.GCP_PLAN_AWS_CONFIG }}" \
            -var="gcp_config_path=${{ matrix.gcp_config_path }}" \
            -out=tfplan 2>&1 | tee "${GITHUB_WORKSPACE}/gcp-plans/${base}.txt"

      - name: Ensure real GCP plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-plans"
          file="${GITHUB_WORKSPACE}/gcp-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "Real GCP plan produced no output for ${base}." > "$file"
          fi

      - name: Upload real GCP plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-gcp-${{ strategy.job-index }}
          path: ${{ github.workspace }}/gcp-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # SAFETY: live apply is intentionally disabled. This pipeline defaults to
      # plan-only execution. The block below is a YAML comment, so GitHub
      # Actions does not parse it and the command cannot run.
      #
      # - name: Terraform apply
      #   run: terraform apply -input=false tfplan

  # Mock plan of the same GCP project files as terraform-plan-gcp. No real
  # credentials. Does not comment. On pull_request, comment-gcp-mock posts
  # <!-- landing-zone-plan-gcp-mock -->. Push to main and workflow_dispatch still plan.
  terraform-plan-gcp-mock:
    name: terraform-plan-gcp-mock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gcp_config_path: *gcp_config_paths
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same AWS account file and GCP project file as the real GCP plan.
      # Moto plus the loopback Compute stub. No secrets. No apply.
      # GITHUB_TOKEN is cleared so the plan script cannot read or print it.
      - name: Terraform plan against the GCP mock
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-mock-plans"
          ./scripts/plan-with-gcp-mock.sh "${{ env.GCP_PLAN_AWS_CONFIG }}" "${{ matrix.gcp_config_path }}" 2>&1 | tee "${GITHUB_WORKSPACE}/gcp-mock-plans/${base}.txt"

      - name: Ensure GCP mock plan file exists
        if: always()
        run: |
          base=$(basename "${{ matrix.gcp_config_path }}" .json)
          mkdir -p "${GITHUB_WORKSPACE}/gcp-mock-plans"
          file="${GITHUB_WORKSPACE}/gcp-mock-plans/${base}.txt"
          if [ ! -f "$file" ]; then
            echo "GCP mock plan produced no output for ${base}." > "$file"
          fi

      - name: Upload GCP mock plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-gcp-mock-${{ strategy.job-index }}
          path: ${{ github.workspace }}/gcp-mock-plans
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # One sticky GCP mock comment for the whole matrix. Pull requests only.
  # Push to main and workflow_dispatch do not comment.
  comment-gcp-mock:
    name: comment-gcp-mock
    needs: terraform-plan-gcp-mock
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.terraform-plan-gcp-mock.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download GCP mock plans
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: plan-gcp-mock-*
          path: plans/gcp-mock

      - name: Post or update sticky GCP mock plan comment
        if: always()
        uses: actions/github-script@v9
        env:
          PLAN_RESULT: ${{ needs.terraform-plan-gcp-mock.result }}
          PLAN_DIR: ${{ github.workspace }}/plans/gcp-mock
        with:
          script: |
            const path = require("path");
            const { postGcpMockPlanComment } = require(path.join(process.env.GITHUB_WORKSPACE, "scripts", "gcp-mock-plan-comment.js"));
            await postGcpMockPlanComment({ github, context, core });

  # Real GCP plan comment only. comment-gcp-mock posts <!-- landing-zone-plan-gcp-mock -->.
  # No checkout. Pull requests only; push and workflow_dispatch skip it.
  comment-gcp-plan:
    name: comment-gcp-plan
    needs:
      - gcp-credentials-present
      - terraform-plan-gcp
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.gcp-credentials-present.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download real GCP plan
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          # Digits only, so this does not also download plan-gcp-mock-*.
          pattern: plan-gcp-[0-9]*
          path: plans/gcp

      - name: Post or update sticky GCP plan comment
        if: always()
        uses: actions/github-script@v9
        env:
          REAL_RESULT: ${{ needs.terraform-plan-gcp.result }}
          REAL_CONFIGURED: ${{ needs.gcp-credentials-present.outputs.configured }}
          GCP_MODE: ${{ needs.gcp-credentials-present.outputs.gcp_mode }}
          AWS_MODE: ${{ needs.gcp-credentials-present.outputs.aws_mode }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const MAX_PLAN = 60000;
            const MAX_COMMENT = 65000;
            const REAL_MARKER = "<!-- landing-zone-plan-gcp -->";

            function stripAnsi(text) {
              return String(text)
                .replace(/\u001b\[[0-9;]*[A-Za-z]/g, "")
                .replace(/\u001b\][^\u0007]*(?:\u0007|\u001b\\)/g, "");
            }

            function redact(text) {
              return stripAnsi(text)
                .replace(/\u0000/g, "")
                .replace(/\b(AKIA|ASIA|AROA|AIDA)[0-9A-Z]{16}\b/g, "[redacted]")
                .replace(/\bgithub_pat_[A-Za-z0-9_]{20,}\b/g, "[redacted]")
                .replace(/\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}\b/g, "[redacted]")
                .replace(/(aws_secret_access_key|aws_access_key_id|aws_session_token)\s*[:=]\s*\S+/gi, "$1=[redacted]")
                .replace(/"private_key"\s*:\s*"[^"]*"/g, '"private_key":"[redacted]"')
                .replace(/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g, "[redacted]")
                .replace(/\bya29\.[0-9A-Za-z\-_]+\b/g, "[redacted]");
            }

            function truncate(text, limit) {
              if (text.length <= limit) return text;
              const suffix = `\n… truncated to ${limit} characters`;
              const keep = Math.max(0, limit - suffix.length);
              return text.slice(0, keep) + suffix;
            }

            function escapeHtml(text) {
              return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            }

            function planHtml(body, limit) {
              const clipped = truncate(redact(body), limit);
              let escaped = escapeHtml(clipped);
              if (escaped.length > limit) escaped = truncate(escaped, limit);
              return escaped;
            }

            function detailsBlock(summary, body, limit) {
              return [
                "<details>",
                `<summary>${escapeHtml(summary)}</summary>`,
                "",
                `<pre><code>${planHtml(body, limit)}</code></pre>`,
                "</details>",
              ].join("\n");
            }

            function walkTxt(dir, found) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walkTxt(full, found);
                else if (entry.isFile() && entry.name.endsWith(".txt")) found.push(full);
              }
            }

            function planSummaryLine(text) {
              const plan = text.match(/^Plan:\s+\d+\s+to add,\s+\d+\s+to change,\s+\d+\s+to destroy\.?\s*$/m);
              if (plan) return plan[0].trim();
              const none = text.match(/^No changes\..+$/m);
              if (none) return none[0].trim();
              return "";
            }

            function sectionsUnder(dir) {
              if (!fs.existsSync(dir)) return [];
              const files = [];
              walkTxt(dir, files);
              files.sort();
              return files.map((file) => {
                const raw = stripAnsi(fs.readFileSync(file, "utf8").slice(0, 80000));
                const name = path.basename(file, ".txt");
                const summaryLine = planSummaryLine(raw);
                return {
                  summary: summaryLine ? `${name}: ${summaryLine}` : name,
                  body: raw.trim() ? raw : "(no output)",
                };
              });
            }

            function render(marker, header, sections) {
              const wrapper = (summary) =>
                `<details>\n<summary>${escapeHtml(summary)}</summary>\n\n<pre><code></code></pre>\n</details>\n\n`.length;
              let overhead = marker.length + 1 + header.length + 2;
              for (const section of sections) overhead += wrapper(section.summary);
              const per =
                sections.length === 0
                  ? MAX_PLAN
                  : Math.max(2000, Math.min(MAX_PLAN, Math.floor((MAX_COMMENT - overhead) / sections.length)));
              const blocks = sections.map((section) => detailsBlock(section.summary, section.body, per));
              let body = `${marker}\n${header}`;
              if (blocks.length) body += `\n\n${blocks.join("\n\n")}`;
              if (body.length > MAX_COMMENT && sections.length) {
                const overflow = body.length - MAX_COMMENT;
                const tighter = Math.max(500, per - Math.ceil(overflow / sections.length) - 80);
                const again = sections.map((section) => detailsBlock(section.summary, section.body, tighter));
                body = `${marker}\n${header}\n\n${again.join("\n\n")}`;
              }
              if (body.length > MAX_COMMENT) {
                body = `${body.slice(0, MAX_COMMENT - 28)}\n… comment truncated`;
              }
              return body;
            }

            async function upsert(comments, marker, body) {
              const existing = comments.find(
                (comment) => typeof comment.body === "string" && comment.body.startsWith(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`Updated comment ${existing.id} for ${marker}`);
                return;
              }
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              comments.push(created.data);
              console.log(`Created comment ${created.data.id} for ${marker}`);
            }

            const realResult = process.env.REAL_RESULT || "unknown";
            const configured = process.env.REAL_CONFIGURED || "";
            const gcpMode = process.env.GCP_MODE || "unset";
            const awsMode = process.env.AWS_MODE || "unset";
            const realSkipped = realResult === "skipped" || configured !== "true";

            let realHeader = "## Terraform plan (real GCP)\n\n";
            let realSections = [];
            if (realSkipped && gcpMode === "unset" && awsMode === "unset") {
              realHeader +=
                "Real GCP plan was skipped because a plan of root talks to both providers, " +
                "and both GCP credentials and AWS plan secrets are unset. " +
                "Set `GCP_WORKLOAD_IDENTITY_PROVIDER` and `GCP_SERVICE_ACCOUNT` (or `GCP_SA_KEY`), " +
                "and `AWS_PLAN_ROLE_ARN` (or both `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`). " +
                "Secret values are not printed. Apply is not a step in this workflow.";
            } else if (realSkipped && gcpMode === "unset") {
              realHeader +=
                `Real GCP plan was skipped because GCP credentials are unset. AWS plan mode is \`${awsMode}\`. ` +
                "Set `GCP_WORKLOAD_IDENTITY_PROVIDER` and `GCP_SERVICE_ACCOUNT`, or `GCP_SA_KEY`. " +
                "Secret values are not printed. Apply is not a step in this workflow.";
            } else if (realSkipped && awsMode === "unset") {
              realHeader +=
                `Real GCP plan was skipped because AWS plan secrets are unset. GCP mode is \`${gcpMode}\`. ` +
                "A plan of root talks to both providers, so AWS plan credentials are required too. " +
                "Secret values are not printed. Apply is not a step in this workflow.";
            } else if (realSkipped) {
              realHeader +=
                `Real GCP plan was skipped (job result: \`${realResult}\`). Secret values are not printed.`;
            } else {
              realHeader +=
                "Job `terraform-plan (real GCP)` " +
                `result: \`${realResult}\`. GCP mode: \`${gcpMode}\`. AWS mode: \`${awsMode}\`. ` +
                "Secret values are not printed. This run does not apply.";
              realSections = sectionsUnder("plans/gcp");
              if (realSections.length === 0) {
                realHeader += "\n\nThe real GCP plan job did not upload plan output.";
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            await upsert(comments, REAL_MARKER, render(REAL_MARKER, realHeader, realSections));
